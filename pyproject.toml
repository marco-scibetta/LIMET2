[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "limet"
version = "2.0.0"
description = "Spec-driven engineering plugin for Claude Code."
requires-python = ">=3.10"
dependencies = [
    "graphifyy[mcp]==0.9.32",
    "qdrant-client",
    "requests",
    "python-dotenv",
    "markitdown[all]",
    "ebooklib",
    "markdownify",
    "beautifulsoup4",
    "pypdfium2",
    "PyYAML",
    "psycopg2-binary",
    "fastapi",
    "uvicorn",
]
